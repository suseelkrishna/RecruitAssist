[project]
name = "recruitassist-backend"
version = "0.2.0"
description = "RecruitAssist backend: synthetic recruiting data, MCP tools, and tests."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "mcp==2.3.0",
    "pydantic>=2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "anyio>=4",
    "openai>=3.48.0",
    "pytest>=8.0",
]
# The OpenAI SDK is only needed for eval runs (evals/run.py) and the adapter tests.
# It is not in requirements.txt, so the deployed API never installs it.
evals = [
    "openai>=3.48.0",
]

[tool.uv]
package = false

# Vercel loads the FastAPI app from app/main.py. Naming it here keeps the older
# server.py at the project root from being picked as the entrypoint.
[tool.vercel]
entrypoint = "app.main:app"

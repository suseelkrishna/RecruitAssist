[project]
name = "recruitassist-backend"
version = "0.2.0"
description = "RecruitAssist backend: synthetic recruiting data, MCP tools, and tests."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pydantic>=2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "anyio>=4",
    "pytest>=8.0",
]

[tool.uv]
package = false
